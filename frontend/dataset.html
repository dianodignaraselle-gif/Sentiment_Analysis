    </div>

    <div class="card">
      <div class="dataset-toolbar">
        <input type="text" id="search-input" placeholder="Search comments..." />
        <select id="product-filter">
          <option value="">All Products</option>
        </select>
      </div>

      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>No.</th>
              <th>Comment</th>
              <th>Sentiment</th>
              <th>Date</th>
              <th>Likes</th>
              <th>Product</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <div class="pagination">
        <div id="range-label">Showing 0 of 0 comments</div>
        <div class="page-btns" id="page-btns"></div>
      </div>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
<script src="js/api.js"></script>
<script>
  const PAGE_SIZE = 10;
  let state = { page: 1, search: "", product: "" };
  let searchTimer = null;

  async function loadProducts() {
    try {
      const { products } = await Api.products();
      const select = document.getElementById("product-filter");
      products.forEach((p) => {
        const opt = document.createElement("option");
        opt.value = p;
        opt.textContent = p;
        select.appendChild(opt);
      });
    } catch (_) {}
  }

  function renderRows(rows, startIndex) {
    const body = document.getElementById("table-body");
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="6"><div class="empty-state">No comments found.</div></td></tr>';
      return;
    }
    body.innerHTML = rows
      .map(
        (r, i) => `
        <tr>
          <td>${startIndex + i + 1}</td>
          <td>${escapeHtml(r.comment)}</td>
          <td><span class="badge ${r.sentiment}">${sentimentEmoji(r.sentiment)} ${r.sentiment}</span></td>
          <td>${r.comment_date}</td>
          <td>${r.likes ?? "-"}</td>
          <td>${escapeHtml(r.product || "-")}</td>
        </tr>`
      )
      .join("");
  }

  function renderPagination(total, page, pageSize) {
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    const startIndex = (page - 1) * pageSize;
    const shown = Math.min(pageSize, total - startIndex);
    document.getElementById("range-label").textContent =
      total === 0
        ? "Showing 0 of 0 comments"
        : `Showing ${startIndex + 1} to ${startIndex + shown} of ${total.toLocaleString()} comments`;

    const btnWrap = document.getElementById("page-btns");
    btnWrap.innerHTML = "";

    const addBtn = (label, targetPage, opts = {}) => {
      const btn = document.createElement("button");
      btn.textContent = label;
      if (opts.active) btn.classList.add("active");
      if (opts.disabled) btn.disabled = true;
      btn.addEventListener("click", () => {
        state.page = targetPage;
        load();
      });
      btnWrap.appendChild(btn);
    };

    addBtn("‹", Math.max(1, page - 1), { disabled: page === 1 });

    const pages = new Set([1, totalPages, page, page - 1, page + 1].filter((p) => p >= 1 && p <= totalPages));
    let prev = 0;
    [...pages].sort((a, b) => a - b).forEach((p) => {
      if (prev && p - prev > 1) {
        const span = document.createElement("span");
        span.textContent = "…";
        span.style.padding = "0 4px";
        btnWrap.appendChild(span);
      }
      addBtn(String(p), p, { active: p === page });
      prev = p;
    });

    addBtn("›", Math.min(totalPages, page + 1), { disabled: page === totalPages });
  }

  async function load() {
    try {
      const data = await Api.dataset({
        page: state.page,
        pageSize: PAGE_SIZE,
        search: state.search,
        product: state.product,
      });
      renderRows(data.rows, (data.page - 1) * data.page_size);
      renderPagination(data.total, data.page, data.page_size);
    } catch (err) {
      showToast("Could not load dataset.", true);
    }
  }

  document.getElementById("search-input").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.search = e.target.value;
      state.page = 1;
      load();
    }, 300);
  });

  document.getElementById("product-filter").addEventListener("change", (e) => {
    state.product = e.target.value;
    state.page = 1;
    load();
  });

  document.getElementById("refresh-btn").addEventListener("click", () => {
    load();
    showToast("Dataset refreshed.");
  });

  document.getElementById("export-btn").addEventListener("click", (e) => {
    e.preventDefault();
    window.location.href = Api.exportCsvUrl();
  });

  loadProducts();
  load();
</script>
